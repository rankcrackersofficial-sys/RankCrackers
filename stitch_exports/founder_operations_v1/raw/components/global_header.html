<!-- Global Header Component -->
<header class="h-[62px] bg-white border-b border-[#E2E8F0] px-4 md:px-6 flex items-center justify-between sticky top-0 z-40 select-none">
  <div class="flex items-center space-x-3.5">
    <!-- Official RankCrackers Solid Black Logo Symbol -->
    <div class="w-10 h-10 bg-[#000000] rounded-xl flex items-center justify-center shadow-sm shrink-0">
      <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <polygon points="12 2 20 6.5 20 12.5 12 22 4 12.5 4 6.5 12 2"></polygon>
        <path d="M12 7v5l3 3"></path>
        <circle cx="12" cy="12" fill="currentColor" r="1.5"></circle>
      </svg>
    </div>
    <div class="flex items-center space-x-2.5">
      <span class="text-xl font-black text-slate-900 tracking-tight font-sans">RankCrackers</span>
      <span class="bg-amber-50 text-amber-800 border border-amber-300 font-mono text-[10px] font-bold px-2 py-0.5 rounded-full tracking-wider uppercase">
        FOUNDER CONSOLE
      </span>
    </div>
    <div class="h-5 w-[1px] bg-[#E2E8F0] hidden xl:block"></div>
    <div class="hidden xl:flex items-center space-x-2">
      <span class="flex items-center space-x-1 px-2.5 py-1 bg-[#F8FAFC] border border-[#CBD5E1] rounded text-[11px] font-mono text-slate-700 font-semibold">
        <span class="w-1.5 h-1.5 rounded-full bg-[#15803D]"></span>
        <span>[LVL-0 FOUNDER AUTH: VERIFIED]</span>
      </span>
      <span class="flex items-center space-x-1 px-2.5 py-1 bg-[#F8FAFC] border border-[#CBD5E1] rounded text-[11px] font-mono text-slate-700 font-semibold">
        <span class="w-1.5 h-1.5 rounded-full bg-[#2563EB] animate-pulse"></span>
        <span>FIRESTORE: automation_runs</span>
      </span>
    </div>
  </div>
  <div class="flex items-center space-x-3">
    <button class="border border-[#DC2626] text-[#DC2626] hover:bg-red-50 text-xs font-mono font-bold px-3 py-1.5 rounded flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-[#DC2626]"></span>
      <span>[Emergency Halt Pipeline]</span>
    </button>
    <button class="border border-[#D97706] text-[#D97706] hover:bg-amber-50 text-xs font-mono font-bold px-3 py-1.5 rounded flex items-center gap-1.5">
      <span>[Halt Student Delivery]</span>
    </button>
    <button class="border border-[#64748B] text-[#475569] hover:bg-slate-100 text-xs font-mono font-bold px-3 py-1.5 rounded flex items-center gap-1.5">
      <span>[Archive Mission]</span>
    </button>
    <button class="bg-[#9A7B38] text-white hover:bg-[#84692E] text-xs font-mono font-bold px-3.5 py-1.5 rounded shadow-sm">
      <span>[System Policy Settings]</span>
    </button>
  </div>
</header>
