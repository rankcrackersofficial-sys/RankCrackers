name: PR10 validation

on:
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Functions dependencies
        run: npm install --ignore-scripts --no-package-lock
      - name: Build Functions
        run: npm run build
      - name: Domain-M regression
        run: |
          npm run test:mission-source-finalizer
          npm run test:mission-official-origin-provenance
          npm run test:mission-source-pair
          npm run test:mission-source-pair-coordinator
          npm run test:mission-source-pair-consumer
          npm run test:mission-physical-page-authority
          npm run test:mission-pagewise-job-authority
          npm run test:mission-scanned-page-numbering
          npm run test:mission-scanned-ocr-guard
          npm run test:mission-agnostic-execution
          npm run test:mission-neutral-projection
          npm run test:android-release-signing-governance
          npm run test:mission-storage-rules-scope
          npm run test:mission-shell-bootstrap
          npm run test:ssc-cgl-notification-schema
          npm run test:ingestion-authority
          npm run test:mission-source-preflight
          npm run test:mission-source-verifier
          npm run test:mission-force-pipeline-runner
          npm run test:mission-force-pipeline-entrypoint

  founder-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib/features/admin/presentation/widgets/mission_control/mission_creation_center.dart lib/features/admin/presentation/widgets/mission_control/mission_control_center.dart lib/web/founder/mission_control/founder_mission_inventory.dart
      - run: flutter build web -t lib/main_web.dart --release

  # Separate Student/Android acceptance. A green backend cannot mask a
  # broken Android application or cross-platform source contract.
  student-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Student entrypoint and routing
        id: analyze
        continue-on-error: true
        run: flutter analyze lib/main.dart lib/core/router lib/core/ai lib/core/firebase
      - name: Run Student and shared Flutter tests
        id: tests
        continue-on-error: true
        run: flutter test --no-pub
      - name: Build Student Android debug APK
        id: android
        continue-on-error: true
        run: flutter build apk --debug --no-pub
      - name: Enforce all Student acceptance results
        if: always()
        run: |
          echo "Student analyze: ${{ steps.analyze.outcome }}"
          echo "Student Flutter tests: ${{ steps.tests.outcome }}"
          echo "Student Android build: ${{ steps.android.outcome }}"
          test "${{ steps.analyze.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.android.outcome }}" = "success"
