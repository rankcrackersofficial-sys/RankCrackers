name: rank_crackers
description: "The Self Study Coach"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ==============================
  # UI & NAVIGATION
  # ==============================
  cupertino_icons: ^1.0.9
  google_fonts: ^6.3.3
  go_router: ^17.3.0
  flutter_riverpod: ^2.6.1
  intl: ^0.19.0
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0

  # ==============================
  # NETWORK & STORAGE
  # ==============================
  dio: ^5.9.2
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.6
  file_picker: ^8.3.7
  image_picker: ^1.2.2
  syncfusion_flutter_pdf: ^28.2.12
  google_mlkit_text_recognition: ^0.14.0
  pdfx: ^2.9.2
  excel: ^4.0.6
  archive: ^3.6.1
  xml: ^6.6.1
  collection: ^1.19.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # ==============================
  # FIREBASE
  # ==============================
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.2+10
  firebase_crashlytics: ^4.3.10
  firebase_performance: ^0.10.1+10

  # ==============================
  # UTILITIES
  # ==============================
  meta: ^1.18.0
  equatable: ^2.0.8
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.1
  connectivity_plus: ^6.1.5
  crypto: ^3.0.7
  path: ^1.9.1

  # ==============================
  # SPLASH
  # ==============================
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # ==============================
  # CODE GENERATION
  # ==============================
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

# ==========================================
# APP ICON CONFIG
# ==========================================

flutter_launcher_icons:
  android: true
  ios: false

  image_path: "assets/images/logo.png"

  adaptive_icon_background: "#060B16"
  adaptive_icon_foreground: "assets/images/logo.png"

  min_sdk_android: 21

# ==========================================
# SPLASH CONFIG
# ==========================================

flutter_native_splash:
  color: "#060B16"
  image: "assets/images/logo.png"

  android_12:
    color: "#060B16"
    image: "assets/images/logo.png"

# ==========================================
# FLUTTER CONFIG
# ==========================================

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/google.png
    - assets/data/preview/jee_main_2027/
    - assets/data/
    - assets/data/digibook_runtime/
    - assets/data/digibook_lessons/
    - docs/academic_review/digibook_authority_bridge_manifest.json
