  <script>
    // Web-only release guard: remove stale Flutter PWA workers/caches left by
    // older deployments before the current Founder console is bootstrapped.
    (async function clearLegacyWebRuntime() {
      if (!('serviceWorker' in navigator) || !('caches' in window)) return;
      const key = 'rc-web-runtime-reset-20261016';
      if (sessionStorage.getItem(key) === 'done') return;
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const hadLegacyWorker = registrations.length > 0;
        await Promise.all(registrations.map((registration) => registration.unregister()));
        const cacheNames = await caches.keys();
        await Promise.all(cacheNames.map((name) => caches.delete(name)));
        sessionStorage.setItem(key, 'done');
        if (hadLegacyWorker || cacheNames.length > 0) {
          const url = new URL(window.location.href);
          url.searchParams.set('rc_runtime_reset', '1');
          window.location.replace(url.toString());
        }
      } catch (_) {
        // Cache cleanup is best-effort; the app must still be allowed to boot.
      }
    })();
  </script>
